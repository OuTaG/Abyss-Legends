name: Nettoyage des prévisualisations

# Supprime le dossier de prévisualisation quand une branche est supprimée.
on:
  delete:

permissions:
  contents: write

jobs:
  nettoyer:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
        continue-on-error: true
      - name: Supprimer le dossier
        run: |
          nom=$(echo '${{ github.event.ref }}' | tr '/_' '--' | tr -cd 'A-Za-z0-9.-')
          if [ -d "previews/$nom" ]; then
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git rm -rq "previews/$nom"
            git commit -m "Suppression de la prévisualisation de $nom"
            git push
          fi
